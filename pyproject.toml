[project]
name = "auto-annotater"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

src = ["src", "."]

exclude = [
    "*.md",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E261",    # at least two spaces before inline comment — prefer one space
    "E501",    # line too long — handled by formatter
    "B008",    # do not perform function calls in argument defaults (FastAPI Depends)
    "SIM108",  # use ternary operator — readability preference
    "SIM113",  # use enumerate() — readability preference
    "SIM115",  # use context manager for open() — standalone scripts
    "UP007",   # use X | Y for union types — keeps Optional for broader compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
